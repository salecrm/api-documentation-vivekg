$kind: http-request
url: "{{Base url}}/brs/page?ledger=15&filter="
method: GET
queryParams:
  - key: pageNumber
    value: "0"
    disabled: true
  - key: pageSize
    value: "40"
    disabled: true
  - key: search
    value: Loan from Bank
    disabled: true
  - key: startDate
    value: 2026-01-01
    disabled: true
  - key: endDate
    value: 2026-01-30
    disabled: true
  - key: dateRange
    value: month
    disabled: true
  - key: direction
    value: desc
    disabled: true
  - key: ledger
    value: "15"
  - key: filter
    value: ""
auth:
  type: bearer
  credentials:
    token: "{{Password}}"
order: 1000
