$kind: http-request
url: "{{Base url}}/purchase/purchase-summary"
method: GET
queryParams:
  - key: pageNumber
    value: "0"
    disabled: true
  - key: pageSize
    value: "10"
    disabled: true
  - key: field
    value: purchasedate
    disabled: true
  - key: direction
    value: desc
    disabled: true
  - key: search
    value: supplier-12
    disabled: true
  - key: startDate
    value: 2025-12-18
    disabled: true
  - key: endDate
    value: 2025-12-22
    disabled: true
  - key: dateRange
    value: month
    disabled: true
auth:
  type: bearer
  credentials:
    token: "{{Password}}"
order: 2000
